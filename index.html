<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<title>采集1.0</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" onerror="this.remove();var s=document.createElement('script');s.src='https://unpkg.com/hls.js@1.5.13/dist/hls.min.js';s.onerror=function(){this.remove();var s2=document.createElement('script');s2.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';document.head.appendChild(s2);};document.head.appendChild(s);"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cat-tabs,.source-tabs,.play-tabs{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x}
html{overflow-x:hidden;overflow-x:clip;width:100%}
body{overflow-x:hidden;overflow-x:clip;width:100%;-webkit-overflow-scrolling:touch}
:root{--bg:#f5f5f7;--card:#ffffff;--card-hover:#f0f0f2;--primary:#6c5ce7;--primary-hover:#5b4bd6;--text:#1a1a2e;--text-dim:#8e8e93;--border:#e0e0e4;--radius:12px;--success:#00b894;--danger:#e74c3c;--shadow:0 2px 12px rgba(0,0,0,0.08)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;min-height:100vh;padding-bottom:70px}
.container{max-width:100%;width:100%;margin:0 auto;padding:12px;overflow-x:hidden;overflow-x:clip}
.header{position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:100;padding:8px 0;border-bottom:1px solid var(--border)}
.header .container{display:flex;gap:8px;align-items:center;padding:0 12px}
.logo{font-size:17px;font-weight:700;white-space:nowrap;flex-shrink:0;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo.hide{display:none}
.search-box{flex:1;display:flex;gap:8px;min-width:0}
.search-input{flex:1;min-width:0;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:16px;outline:none;transition:border .2s;box-shadow:var(--shadow)}
.search-input:focus{border-color:var(--primary)}
.btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:24px;cursor:pointer;font-size:14px;white-space:nowrap;transition:background .2s}
.btn:active{background:var(--primary-hover)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:16px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.btn-outline:active{border-color:var(--primary);color:var(--text)}
.btn-icon{padding:8px 12px;font-size:18px;background:var(--card);border:1px solid var(--border)}
.header-back-btn{background:var(--primary);color:#fff;border:none;font-size:18px;font-weight:700;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;box-shadow:var(--shadow);animation:backBtnPulse .4s ease}
.header-back-btn:active{background:var(--primary-hover);transform:scale(0.92)}
@keyframes backBtnPulse{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;width:100%;max-width:100%;overflow:hidden}
.video-card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:var(--shadow);min-width:0;max-width:100%;width:100%}
.video-card:active{transform:scale(0.96)}
.video-card .cover{width:100%;aspect-ratio:3/4;background:#e8e8ec;position:relative;overflow:hidden}
.video-card .cover img{width:100%;height:100%;object-fit:cover}
.video-card .cover .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:12px;text-align:center;padding:8px}
.video-card .remarks{position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.75);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px 0 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card .info{padding:6px 8px;min-width:0;overflow:hidden}
.video-card .title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-card .sub{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-wrap{position:relative;min-width:0;max-width:100%;width:100%;overflow:hidden}
.del-btn{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(231,76,60,0.9);color:#fff;border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;line-height:1;-webkit-tap-highlight-color:transparent;pointer-events:auto;touch-action:manipulation}
.del-btn:active{background:rgba(231,76,60,1);transform:scale(0.9)}
.loading{text-align:center;padding:40px;color:var(--text-dim)}
.loading .spinner{display:inline-block;width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty .icon{font-size:48px;margin-bottom:12px}
.section-title{font-size:16px;font-weight:600;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;background:var(--primary);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.source-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.source-tabs::-webkit-scrollbar{display:none}
.source-tab{padding:6px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s;touch-action:pan-x}
.source-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.source-tab .count{font-size:11px;opacity:.7;margin-left:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h2{font-size:18px;font-weight:600}
.modal-close{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;padding:4px 12px;border-radius:20px;font-weight:600;-webkit-tap-highlight-color:transparent}
.modal-close:active{background:var(--card-hover)}
.modal-body{padding:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
.form-input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.dm-cfg-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;gap:8px}
.dm-cfg-row+.dm-cfg-row{border-top:1px solid var(--border)}
.dm-cfg-row>span:first-child{color:var(--text);flex-shrink:0}
.dm-cfg-slider{width:120px;accent-color:var(--primary)}
.dm-cfg-area-btns{display:flex;gap:4px}
.dm-cfg-area-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dm-cfg-area-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.dm-cfg-select{padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.dm-cfg-delay-wrap{display:flex;align-items:center;gap:6px;width:100%}
.dm-cfg-delay-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.dm-cfg-delay-btn:active{background:var(--card-hover)}
.dm-cfg-delay-val{font-size:13px;color:var(--primary);font-weight:600;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.dm-cfg-toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.dm-cfg-toggle.on{background:var(--primary)}
.dm-cfg-toggle .knob{width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s}
.dm-cfg-toggle.on .knob{left:22px}
.form-input:focus{border-color:var(--primary)}
.source-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.source-list-item .name{font-size:14px;font-weight:500}
.source-list-item .url{font-size:11px;color:var(--text-dim);margin-top:2px;word-break:break-all}
.source-list-item .actions{display:flex;gap:6px;flex-shrink:0}
.detail-overlay{position:fixed;inset:0;background:#f5f5f7;z-index:150;display:none}
.detail-overlay.show{display:block}
.overlay-iframe{width:100%;height:100%;border:none;display:block}
.player-section{position:fixed;inset:0;background:#000;z-index:300;display:none}
.player-section.show{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:90}
.nav-item{flex:1;padding:10px 0;text-align:center;cursor:pointer;color:var(--text-dim);font-size:12px;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item .icon{font-size:20px;display:block;margin-bottom:2px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:12px 24px;border-radius:8px;z-index:500;font-size:14px;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-width:90%;text-align:center;color:var(--text)}
.toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.proxy-status{position:fixed;top:60px;right:12px;background:var(--success);color:#fff;padding:4px 12px;border-radius:12px;font-size:11px;z-index:50}
.proxy-switching{background:var(--danger)}
.home-skeleton{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.home-skeleton .sk-poster{width:100%;aspect-ratio:3/4;border-radius:8px;background:#e8e8ec;animation:pulse 1.5s ease infinite}
.home-skeleton .sk-line{height:12px;border-radius:4px;background:#e8e8ec;margin-top:6px;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
.search-back{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.search-back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;box-shadow:var(--shadow)}
.search-back-btn:active{background:var(--card-hover)}
.cat-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;  /* 关键：允许横向滚动 */
  padding: 4px 0 8px;
  -webkit-overflow-scrolling: touch; /* iOS流畅滚动 */
  scrollbar-width: none; /* Firefox隐藏滚动条 */
}
.cat-tabs::-webkit-scrollbar {
  display: none; /* Chrome/Safari隐藏滚动条 */
}
.cat-tab{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;cursor:pointer;font-size:12px;white-space:nowrap;color:var(--text-dim);transition:background-color .15s,color .15s,border-color .15s;touch-action:pan-x}
.cat-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.card-wrap{position:relative;min-width:0;max-width:100%;width:100%;overflow:hidden}
.card-resume-btn{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;padding:6px 4px;background:rgba(108,92,231,0.1);border:none;border-radius:6px;color:var(--primary);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.card-resume-btn.no-progress{opacity:0.5}
.progress-mini{width:100%;height:3px;background:#e0e0e4;border-radius:2px;margin-top:4px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--primary);border-radius:2px}
.progress-mini-text{font-size:10px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
<div class="container">
<button class="btn btn-icon header-back-btn" id="headerBackBtn" onclick="goBack()" style="display:none">←</button>
<div class="logo">🎬 影视聚合</div>
<div class="search-box">
<input class="search-input" id="searchInput" placeholder="搜索影视..." autocomplete="off">
</div>
</div>
</div>

<div class="proxy-status" id="proxyStatus">✓ 云代理已连接</div>

<div class="container" id="mainContent">
<div id="homeView">
<div class="cat-tabs" id="catTabs"></div>
<div id="homeList"><div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div></div>
</div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
<div class="modal">
<div class="modal-header">
<h2>⚙ 设置</h2>
<button type="button" class="modal-close" onclick="closeSettings()">✕</button>
</div>
<div class="modal-body">
<div class="form-group">
<label>首页数据源（选择首页展示哪个源的内容）</label>
<select class="form-input" id="homeSourceSelect"></select>
<button class="btn btn-sm" style="margin-top:8px;width:100%" onclick="applyHomeSource()">应用并重新加载</button>
<p style="font-size:11px;color:var(--text-dim);margin-top:4px">选择源后点击按钮应用，首页将重新加载</p>
</div>
<div class="form-group">
<label>添加视频源（苹果CMS V10 API）</label>
<input class="form-input" id="newSourceName" placeholder="源名称（如：非凡采集）" style="margin-bottom:8px">
<input class="form-input" id="newSourceUrl" placeholder="API地址（如：https://example.com/api.php/provide/vod）">
<button class="btn btn-sm" style="margin-top:8px;width:100%" onclick="addSource()">+ 添加源</button>
</div>
<div class="form-group">
<label>已配置视频源</label>
<div id="sourceList"></div>
</div>
<div class="form-group">
<label>批量导入（每行一个，格式：名称|API地址）</label>
<textarea class="form-input" id="batchImport" rows="5" placeholder="源名称|https://example.com/api.php/provide/vod&#10;源名称2|https://example2.com/api.php/provide/vod" style="font-family:monospace;font-size:12px;resize:vertical"></textarea>
<button class="btn btn-sm btn-outline" style="margin-top:8px;width:100%" onclick="batchImport()">批量导入</button>
</div>
<div class="form-group">
<label>CORS代理（搜索/详情用）</label>
<select class="form-input" id="proxySelect" onchange="changeProxy()">
<option value="auto">自动选择（推荐）</option>
<option value="0">cors.sh</option>
<option value="1">allorigins</option>
<option value="2">codetabs</option>
<option value="direct">直连（不代理）</option>
</select>
<p style="font-size:11px;color:var(--text-dim);margin-top:4px">搜索无结果时试试切换代理</p>
</div>
<div class="form-group">
<label>弹幕设置（播放页弹幕默认参数）</label>
<div class="dm-cfg-row"><span>默认开启</span><div class="dm-cfg-toggle on" id="cfgDmEnabled" onclick="cfgDmToggle(this)"><div class="knob"></div></div></div>
<div class="dm-cfg-row"><span>不透明度</span><input type="range" class="dm-cfg-slider" id="cfgDmOpacity" min="10" max="100" value="80" oninput="cfgDmSave()"></div>
<div class="dm-cfg-row"><span>字体大小</span><input type="range" class="dm-cfg-slider" id="cfgDmFontSize" min="14" max="48" value="20" oninput="cfgDmSave()"></div>
<div class="dm-cfg-row"><span>显示区域</span><div class="dm-cfg-area-btns">
<button class="dm-cfg-area-btn active" data-area="0" onclick="cfgDmSetArea(this,0)">1/4</button>
<button class="dm-cfg-area-btn" data-area="1" onclick="cfgDmSetArea(this,1)">上1/3</button>
<button class="dm-cfg-area-btn" data-area="2" onclick="cfgDmSetArea(this,2)">上2/3</button>
<button class="dm-cfg-area-btn" data-area="3" onclick="cfgDmSetArea(this,3)">全屏</button>
</div></div>
<div class="dm-cfg-row"><span>弹幕速度</span><select class="dm-cfg-select" id="cfgDmSpeed" onchange="cfgDmSave()">
<option value="80">慢速(80)</option>
<option value="100">较慢(100)</option>
<option value="120" selected>正常(120)</option>
<option value="144">较快(144)</option>
<option value="168">快速(168)</option>
<option value="200">极快(200)</option>
</select></div>
<div class="dm-cfg-row" style="flex-direction:column;align-items:flex-start;gap:6px"><span>默认时延</span>
<div class="dm-cfg-delay-wrap">
<button class="dm-cfg-delay-btn" onclick="cfgDmAdjustDelay(-0.5)">-</button>
<span class="dm-cfg-delay-val" id="cfgDmDelayVal">+0.0s</span>
<button class="dm-cfg-delay-btn" onclick="cfgDmAdjustDelay(0.5)">+</button>
<input type="range" class="dm-cfg-slider" id="cfgDmDelay" min="-10" max="10" step="0.5" value="0" oninput="cfgDmOnDelayInput()" style="flex:1">
</div></div>
<div class="dm-cfg-row" style="flex-direction:column;align-items:flex-start;gap:4px"><span>自定义弹幕API</span>
<div style="display:flex;gap:4px;width:100%">
<input type="text" id="cfgDmCustomApi" placeholder="留空用默认源" style="flex:1;height:28px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:0 8px;font-size:11px;outline:none">
<button onclick="cfgDmSaveCustomApi()" style="background:var(--primary);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap">保存</button>
</div></div>
</div>
<div class="form-group">
<label>数据备份（导出/导入）</label>
<p style="font-size:11px;color:var(--text-dim);margin-bottom:8px">WebView环境可能无法自动保存数据，建议定期导出备份</p>
<div style="display:flex;gap:8px">
<button class="btn btn-sm" style="flex:1" onclick="exportData()">📤 导出数据</button>
<button class="btn btn-sm btn-outline" style="flex:1" onclick="document.getElementById('importBox').style.display='block'">📥 导入数据</button>
</div>
<div id="importBox" style="display:none;margin-top:8px">
<textarea class="form-input" id="importText" rows="4" placeholder="粘贴导出的数据..." style="font-family:monospace;font-size:11px;resize:vertical"></textarea>
<div style="display:flex;gap:8px;margin-top:6px">
<button class="btn btn-sm" style="flex:1" onclick="importData()">确认导入</button>
<button class="btn btn-sm btn-outline" style="flex:1" onclick="document.getElementById('importBox').style.display='none'">取消</button>
</div>
</div>
<div id="exportBox" style="display:none;margin-top:8px">
<textarea class="form-input" id="exportText" rows="4" readonly style="font-family:monospace;font-size:11px;resize:vertical"></textarea>
<p style="font-size:11px;color:var(--text-dim);margin-top:4px">长按选择全部并复制，保存到备忘录等</p>
</div>
</div>
</div>
</div>
</div>

<div class="detail-overlay" id="detailOverlay">
<iframe id="detailIframe" class="overlay-iframe"></iframe>
</div>

<div class="player-section" id="playerSection">
<iframe id="playerIframe" class="overlay-iframe"></iframe>
</div>

<div class="bottom-nav">
<div class="nav-item active" onclick="goHome()">
<span class="icon">🏠</span>首页
</div>
<div class="nav-item" onclick="goHistory()">
<span class="icon">🕐</span>历史
</div>
<div class="nav-item" onclick="goFavorites()">
<span class="icon">⭐</span>收藏
</div>
<div class="nav-item" onclick="openSettings()">
<span class="icon">⚙</span>设置
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== CORS 代理配置 ==========
var CORS_PROXIES = [
  function(url) { return 'https://ys.ggy.ccwu.cc/?url=' + encodeURIComponent(url); },
  function(url) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url); },
  function(url) { return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(url); }
];
var proxyMode = 'auto';
var workingProxyIdx = 0;

function _newAbortController() {
  try { return new AbortController(); } catch(e) { return null; }
}

function _fetchCompat(url, timeout, cb, errCb) {
  var done = false;
  function _cb(text) { if (!done) { done = true; cb(text); } }
  function _err(e) { if (!done) { done = true; errCb(e); } }

  var ctrl = _newAbortController();
  var t = setTimeout(function() {
    if (ctrl) { try { ctrl.abort(); } catch(e) {} }
    _err(new Error('timeout'));
  }, timeout);
  var opts = {};
  if (ctrl) opts.signal = ctrl.signal;
  fetch(url, opts).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(text) {
    clearTimeout(t);
    _cb(text);
  }).catch(function(e) {
    clearTimeout(t);
    _err(e);
  });
}

function cleanResponseText(text) {
  var c = text;
  var si = c.indexOf('<script'); if (si > 0) c = c.substring(0, si);
  si = c.indexOf('<html'); if (si >= 0) c = c.substring(0, si);
  return c.trim();
}
function safeParseJSON(text) {
  var c = cleanResponseText(text);
  try { return JSON.parse(c); } catch(e1) {
    var lb = c.lastIndexOf('}'); if (lb > 0) { try { return JSON.parse(c.substring(0, lb + 1)); } catch(e2) {} }
    throw new Error('JSON parse failed');
  }
}
function fetchJson(url, cb, errCb, timeout) {
  timeout = timeout || 12000;
  if (proxyMode === 'direct') { fetchDirect(url, cb, errCb, timeout); return; }
  if (proxyMode === 'auto') fetchWithAutoProxy(url, 0, cb, errCb, timeout);
  else fetchSingle(CORS_PROXIES[parseInt(proxyMode)](url), cb, errCb, timeout);
}
function fetchWithAutoProxy(url, idx, cb, errCb, timeout) {
  if (idx >= CORS_PROXIES.length) { fetchDirect(url, cb, errCb, timeout); return; }
  var pu = CORS_PROXIES[idx](url);
  _fetchCompat(pu, timeout, function(text) {
    try { workingProxyIdx = idx; cb(safeParseJSON(text)); }
    catch(e) { fetchWithAutoProxy(url, idx + 1, cb, errCb, timeout); }
  }, function() {
    fetchWithAutoProxy(url, idx + 1, cb, errCb, timeout);
  });
}
function fetchSingle(pu, cb, errCb, timeout) {
  _fetchCompat(pu, timeout, function(text) {
    try { cb(safeParseJSON(text)); } catch(e) { errCb(new Error('parse fail')); }
  }, function(e) { errCb(e); });
}
function fetchDirect(url, cb, errCb, timeout) {
  _fetchCompat(url, timeout, function(text) {
    try { cb(safeParseJSON(text)); } catch(e) { errCb(new Error('parse fail')); }
  }, function(e) { errCb(e); });
}
function changeProxy() {
  var sel = document.getElementById('proxySelect');
  proxyMode = sel.value;
  State.settings.proxyMode = proxyMode;
  Config.save(State.settings);
  showToast('代理已切换：' + sel.options[sel.selectedIndex].text);
}

var IDB = {
  db: null,
  ready: false,
  pending: [],
  _initCallbacks: [],
  _initStarted: false,
  init: function(cb) {
    var self = this;
    if (this.ready && this.db) { if (cb) cb(true); return; }
    if (this._initStarted) { if (cb) this._initCallbacks.push(cb); return; }
    this._initStarted = true;
    var _timedOut = false;
    var _idbTimer = setTimeout(function() {
      if (!self.ready) {
        _timedOut = true;
        self._initCallbacks.forEach(function(c) { c(false); });
        self._initCallbacks = [];
        if (cb) cb(false);
      }
    }, 3000);
    var idb = window.indexedDB || window.webkitIndexedDB || window.mozIndexedDB || window.msIndexedDB;
    if (!idb) { 
      clearTimeout(_idbTimer);
      this._initCallbacks.forEach(function(c) { c(false); });
      this._initCallbacks = [];
      if (cb) cb(false); 
      return; 
    }
    try {
      var req = idb.open('vplayer_db', 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
      };
      req.onsuccess = function(e) {
        if (_timedOut) return;
        clearTimeout(_idbTimer);
        self.db = e.target.result;
        self.ready = true;
        self.pending.forEach(function(fn) { fn(); });
        self.pending = [];
        self._initCallbacks.forEach(function(c) { c(true); });
        self._initCallbacks = [];
        if (cb) cb(true);
      };
      req.onerror = function() {
        if (_timedOut) return;
        clearTimeout(_idbTimer);
        self._initCallbacks.forEach(function(c) { c(false); });
        self._initCallbacks = [];
        if (cb) cb(false);
      };
      req.onblocked = function() {
        if (_timedOut) return;
        clearTimeout(_idbTimer);
        self._initCallbacks.forEach(function(c) { c(false); });
        self._initCallbacks = [];
        if (cb) cb(false);
      };
    } catch(e) {
      clearTimeout(_idbTimer);
      self._initCallbacks.forEach(function(c) { c(false); });
      self._initCallbacks = [];
      if (cb) cb(false);
    }
  },
  _exec: function(fn) {
    if (this.ready && this.db) { fn(); }
    else { this.pending.push(fn); }
  },
  get: function(key, cb) {
    if (!this.db && !this._initStarted) { cb(null); return; }
    this._exec(function() {
      try {
        var tx = IDB.db.transaction('kv', 'readonly');
        var req = tx.objectStore('kv').get(key);
        req.onsuccess = function() { cb(req.result || null); };
        req.onerror = function() { cb(null); };
      } catch(e) { cb(null); }
    });
  },
  set: function(key, val, cb) {
    if (!IDB.db && !IDB._initStarted) { if (cb) cb(false); return; }
    IDB._exec(function() {
      try {
        var tx = IDB.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = function() { if (cb) cb(true); };
        tx.onerror = function() { if (cb) cb(false); };
      } catch(e) { if (cb) cb(false); }
    });
  }
};

  defaultSources: [
    { name: '电影天堂', url: 'https://caiji.dyttzyapi.com/api.php/provide/vod' },
    { name: '非凡资源', url: 'https://cj.ffzyapi.com/api.php/provide/vod' },

    { name: '魔都资源', url: 'https://www.mdzyapi.com/api.php/provide/vod' },
    { name: '猫眼资源', url: 'https://api.maoyanapi.top/api.php/provide/vod' },
    { name: '爱奇艺资源', url: 'https://www.iqiyizyapi.com/api.php/provide/vod' }
  ],
  _storageKey: 'vplayer_settings_v8',
  loadSync: function() {
    var s = null, lsData = null;
    try { lsData = _lsGet(this._storageKey); } catch(e) {}
    try { if (lsData) s = JSON.parse(lsData); } catch(e) { s = null; }
    s = s || {};
    if (!s.version || s.version < 8) {
      var old = null;
      try { old = JSON.parse(_lsGet('vplayer_settings_v7') || '{}'); } catch(e2) {}
      if (old && old.sources && old.sources.length > 0) {
        s.sources = old.sources; s.favorites = old.favorites || []; s.history = old.history || []; s.proxyMode = old.proxyMode || 'auto';
      } else { s.sources = this.defaultSources; }
      s.version = 8;
    }
    if (!s.sources || s.sources.length === 0) s.sources = this.defaultSources;
    if (!s.favorites) s.favorites = [];
    if (!s.history) s.history = [];
    if (!s.proxyMode) s.proxyMode = 'auto';
    proxyMode = s.proxyMode;
    return s;
  },
  loadAsync: function(cb) {
    var self = this;
    IDB.init(function(ok) {
      if (!ok) { cb(false); return; }
      IDB.get(self._storageKey, function(data) {
        if (data) {
          try {
            var idbSettings = (typeof data === 'string') ? JSON.parse(data) : data;
            if (idbSettings && idbSettings.sources && idbSettings.sources.length > 0) {
              var cur = State.settings;
              if ((idbSettings._savedAt || 0) > (cur._savedAt || 0)) {
                cb(idbSettings);
              } else {
                cb(null);
              }
              return;
            }
          } catch(e) {}
        }
        cb(null);
      });
    });
  },
  save: function(s) {
    s.proxyMode = proxyMode;
    s._savedAt = Date.now();
    var json = JSON.stringify(s);
    _lsSet(this._storageKey, json);
    IDB.set(this._storageKey, json);
  }
};

// ========== 视图栈 ==========
var viewStack = [];
var _currentTab = 'home';
var _pushStateOK = false;
var _gatePresent = false;
var _exitPending = false;
var _exitTimer = null;
var _suppressHash = false;
var _gateLevel = 0;
var _backLatch = false;
var _exitNow = false;
try { _pushStateOK = (typeof history !== 'undefined' && typeof history.pushState === 'function'); } catch(e) {}

function _pushGate() {
  _gateLevel++;
  var gateHash = '#g' + _gateLevel;
  _suppressHash = true;
  if (_pushStateOK) {
    try { history.pushState({gate:_gateLevel}, '', gateHash); _gatePresent = true; } catch(e) {
      try { location.hash = gateHash; } catch(e2) {}
    }
  } else {
    try { location.hash = gateHash; } catch(e) {}
  }
  setTimeout(function() { _suppressHash = false; }, 100);
}
_pushGate();

function _doBack() {
  if (_backLatch) return;
  _backLatch = true;
  setTimeout(function() { _backLatch = false; }, 200);

  if (_exitNow) {
    _exitNow = false;
    return;
  }

  if (viewStack.length > 0) {
    if (viewStack[viewStack.length - 1] === 'player') {
      try {
        var win = document.getElementById('playerIframe').contentWindow;
        if (win && win.isPanelOpen && win.isPanelOpen()) {
          win.closePanels();
          _pushGate();
          return;
        }
      } catch(e) {}
    }
    var view = viewStack.pop();
    closeViewUI(view);
    updateBackButton();
  } else {
    if (_exitPending) {
      _exitPending = false;
      if (_exitTimer) { clearTimeout(_exitTimer); _exitTimer = null; }
      _exitNow = true;
    } else {
      _exitPending = true;
      showToast('再按一次返回退出', 2000);
      _exitTimer = setTimeout(function() { _exitPending = false; }, 2000);
    }
  }
}

window.addEventListener('popstate', function(e) {
  _gatePresent = false;
  _doBack();
});

window.addEventListener('hashchange', function(e) {
  if (_suppressHash) return;
  var m = (location.hash || '').match(/^#g(\d+)$/);
  var curLevel = m ? parseInt(m[1]) : 0;
  if (curLevel < _gateLevel) {
    _gateLevel = curLevel;
    _gatePresent = false;
    _doBack();
  }
});

function goBack() {
  _doBack();
}

function updateBackButton() {
  var btn = document.getElementById('headerBackBtn');
  var logo = document.querySelector('.logo');
  var show = viewStack.length > 0;
  if (btn) btn.style.display = show ? 'flex' : 'none';
  if (logo) logo.classList.toggle('hide', show);
}

function pushView(view) {
  viewStack.push(view);
  _pushGate();
  updateBackButton();
}

function closeViewUI(view) {
  switch(view) {
    case 'player': closePlayerFrame(); if (viewStack.indexOf('detail') >= 0) { document.getElementById('detailOverlay').classList.add('show'); document.getElementById('detailOverlay').style.pointerEvents='auto'; } else if (viewStack.length === 0) { restoreHomeView(); } break;
    case 'detail': closeDetailFrame(); if (viewStack.length === 0 || (viewStack.indexOf('search') < 0 && viewStack.indexOf('tab-history') < 0 && viewStack.indexOf('tab-favorites') < 0)) { restoreHomeView(); } break;
    case 'settings': closeSettingsUI(); break;
    case 'search':
      State.isSearchView = false;
      if (viewStack.indexOf('tab-history') >= 0) { _currentTab = 'history'; renderHistory(); }
      else if (viewStack.indexOf('tab-favorites') >= 0) { _currentTab = 'favorites'; renderFavorites(); }
      else restoreHomeView();
      break;
    case 'tab-history': restoreHomeView(); break;
    case 'tab-favorites': restoreHomeView(); break;
  }
}

var _homeViewHTML = null;
var _homeScrollY = 0;
var _savedViews = {};
function saveHomeView() {
  var mc = document.getElementById('mainContent');
  if (mc && (_currentTab === 'home' || _currentTab === 'history' || _currentTab === 'favorites' || State.isSearchView)) {
    _savedViews[_currentTab] = mc.innerHTML;

      _homeViewHTML = mc.innerHTML;
      _homeScrollY = window.scrollY;
    }

function restoreHomeView() {
  _currentTab = 'home';
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  var navs = document.querySelectorAll('.nav-item');
  if (navs[0]) navs[0].classList.add('active');
  if (_homeViewHTML) {
    document.getElementById('mainContent').innerHTML = _homeViewHTML;
    var scrollTarget = _homeScrollY;
    var doScroll = function() { window.scrollTo(0, scrollTarget); };
    if (window.requestAnimationFrame) {
      requestAnimationFrame(function() { requestAnimationFrame(doScroll); });
    }
    setTimeout(doScroll, 100);
    return;
  }
  goHomeDirect();
}

function closeViewByButton(view) {

    var removed = viewStack.splice(idx);
    for (var i = removed.length - 1; i >= 0; i--) closeViewUI(removed[i]);
  } else {
    closeViewUI(view);
  }
  updateBackButton();
}

// 替换原有的 loadHomeTypes 函数
function loadHomeTypes() {
  var apiUrl = getHomeSourceUrl() + '?ac=list';
  fetchJson(apiUrl, function(data) {
    // 兼容多种数据结构：优先使用class字段，其次使用list字段
    var classList = (data && (data.class || data.list)) || [];
    var types = [];

    if (classList.length > 0) {
      // ✅ 显示所有分类（包括二级分类）
      types = classList.slice(); // 直接复制所有分类
      
      // 去重
      var seen = new Map();
      types = types.filter(function(t) {
        if (!t || seen.has(t.type_id)) return false;
        seen.set(t.type_id, true);
        return true;
      });
      
      // 按type_id排序，让一级分类排在前面
      types.sort(function(a, b) {
        return a.type_id - b.type_id;
      });
      
      // 补一个"全部"分类
      var hasAll = types.some(function(t) {
        return t.type_id === 0 || t.type_name === '全部';
      });
      if (!hasAll) {
        types.unshift({ type_id: 0, type_name: '全部', type_pid: 0 });
      }
    }

    if (types.length > 0) {
      _homeRetryCount = 0;
      State.homeTypes = types;
      _homeTypesLoaded = true;
      
      console.log('[Home] 加载到 ' + types.length + ' 个分类'); // 调试日志
      
      renderTypeTabs();
      State.homeCurrentPage = 1;
      State.homeHasMore = true;
      loadHomeVideos(0, 1, true);
    } else {
      document.getElementById('homeList').innerHTML =
        '<div class="empty"><div class="icon">😢</div><p>加载分类失败</p>' +
        '<button class="btn btn-sm" style="margin-top:12px" onclick="_homeRetryCount=0;loadHomeTypes()">重试</button></div>';
    }
  }, function(e) {
    _homeRetryCount++;
    if (_homeRetryCount <= 2) {
      document.getElementById('homeList').innerHTML =
        '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在重试... (' + _homeRetryCount + '/2)</p></div>';
      setTimeout(function() { loadHomeTypes(); }, 1500);
    } else {
      document.getElementById('homeList').innerHTML =
        '<div class="empty"><div class="icon">😢</div><p>加载失败，请检查网络或代理</p>' +
        '<button class="btn btn-sm" style="margin-top:12px" onclick="_homeRetryCount=0;loadHomeTypes()">重试</button></div>';
    }
  }, 10000);
}

function renderTypeTabs() {
  var container = document.getElementById('catTabs');
  if (!container) return;
  var html = '';
  State.homeTypes.forEach(function(t) {
    var active = (t.type_id === State.homeCurrentType) ? ' active' : '';
    html += '<div class="cat-tab' + active + '" data-type-id="' + t.type_id + '">' + t.type_name + '</div>';
  });
  container.innerHTML = html;
}

function switchHomeType(typeId, el) {
  State.homeCurrentType = typeId;
  State.homeCurrentPage = 1;
  State.homeHasMore = true;
  document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  loadHomeVideos(typeId, 1, true);
}

function loadHomeVideos(typeId, page, isRefresh) {
  var container = document.getElementById('homeList');
  if (!container) return;
  page = page || 1;
  if (isRefresh) {
    State.homeCurrentPage = 1;
    State.homeHasMore = true;
    var sk = '<div class="home-skeleton">';
    for (var i = 0; i < 9; i++) sk += '<div><div class="sk-poster"></div><div class="sk-line"></div></div>';
    sk += '</div>';
    container.innerHTML = sk;
  }
  if (isRefresh && State.homeCache[typeId]) {
    renderHomeGrid(State.homeCache[typeId], false);
    return;
  }
  if (State.homeLoading) return;
  State.homeLoading = true;
  var apiUrl = getHomeSourceUrl() + '?ac=videolist&pg=' + page;
  if (typeId > 0) apiUrl += '&t=' + typeId;
  fetchJson(apiUrl, function(data) {
    State.homeLoading = false;
    if (data && data.list && data.list.length > 0) {
      var newList = data.list.filter(function(item) {
        var cache = State.homeCache[typeId] || [];
        return !cache.some(function(c) { return c.vod_id === item.vod_id; });
      });
      if (page === 1) {
        State.homeCache[typeId] = newList;
      } else {
        if (!State.homeCache[typeId]) State.homeCache[typeId] = [];
        State.homeCache[typeId] = State.homeCache[typeId].concat(newList);
      }
      State.homeCurrentPage = page;
      State.homeHasMore = data.list.length >= 20 && newList.length > 0;
      if (newList.length > 0) {
        renderHomeGrid(newList, !isRefresh);
      } else {
        if (State.homeHasMore) {
          loadHomeVideos(typeId, page + 1, false);
        } else {
          removeLoadMoreIndicator();
        }
      }
    } else {
      if (page === 1) {
        container.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无内容</p></div>';
      } else {
        State.homeHasMore = false;
        removeLoadMoreIndicator();
      }
    }
  }, function(e) {
    State.homeLoading = false;
    if (page === 1) {
      container.innerHTML = '<div class="empty"><div class="icon">😢</div><p>加载失败，请检查代理设置</p></div>';
    } else {
      removeLoadMoreIndicator();
    }
  }, 12000);
}

function removeLoadMoreIndicator() {
  var indicator = document.getElementById('loadMoreIndicator');
  if (indicator) indicator.remove();
}

function renderHomeGrid(videos, isAppend) {
  var container = document.getElementById('homeList');
  if (!container) return;
  var html = '';
  videos.forEach(function(item) {
    var cover = item.vod_pic || '';
    var title = item.vod_name || '未知';
    var remarks = item.vod_remarks || '';
    var globalIdx = State.homeCache[State.homeCurrentType] ? State.homeCache[State.homeCurrentType].indexOf(item) : -1;
    if (globalIdx < 0) globalIdx = 0;
    html += '<div class="video-card" data-action="home" data-idx="' + globalIdx + '">';
    html += '<div class="cover">';
    if (cover) {
      html += '<img src="' + cover + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
      html += '<div class="placeholder" style="display:none">' + title + '</div>';
    } else {
      html += '<div class="placeholder">' + title + '</div>';
    }
    if (remarks) html += '<div class="remarks">' + remarks + '</div>';
    html += '</div>';
    html += '<div class="info"><div class="title">' + title + '</div></div>';
    html += '</div>';
  });
  if (isAppend) {
    removeLoadMoreIndicator();
    var grid = container.querySelector('.video-grid');
    if (grid) {
      grid.insertAdjacentHTML('beforeend', html);
    } else {
      container.innerHTML = '<div class="video-grid">' + html + '</div>';
    }
  } else {
    container.innerHTML = '<div class="video-grid">' + html + '</div>';
  }
  if (State.homeHasMore) {
    var indicator = document.createElement('div');
    indicator.id = 'loadMoreIndicator';
    indicator.className = 'loading';
    indicator.innerHTML = '<div class="spinner"></div><p style="margin-top:8px;font-size:12px">滑动加载更多...</p>';
    container.appendChild(indicator);
  }
}

function checkScrollLoad() {
  if (State.isSearchView) return;
  if (State.homeLoading || !State.homeHasMore) return;
  var indicator = document.getElementById('loadMoreIndicator');
  if (!indicator) return;
  var rect = indicator.getBoundingClientRect();

function _cleanTitle(s) {
  if (!s) return '';
  return s.replace(/\d{4}年?版?/g, '').replace(/\([^)]*\)/g, '').replace(/【[^】]*】/g, '')
          .replace(/\[[^\]]*\]/g, '').replace(/第[一二三四五六七八九十百\d]+[季部集]/g, '')
          .replace(/[第]\d+/g, '').replace(/\s+/g, '').trim();
}
function _titleMatch(a, b) {
  var ca = _cleanTitle(a), cb = _cleanTitle(b);
  if (!ca || !cb) return true;
  if (ca === cb) return true;
  if (ca.length >= 2 && cb.length >= 2 && (ca.indexOf(cb) >= 0 || cb.indexOf(ca) >= 0)) return true;
  return false;
}

function showDetailAndPlay(item, epIdx, resumeTime, sourceUrl) {
  epIdx = epIdx || 0;
  resumeTime = resumeTime || 0;
  State.currentDetail = item;
  saveHomeView();

  function trySource(url, onFail) {
    State.currentSourceUrl = url;
    var apiUrl = url + '?ac=detail&ids=' + item.vod_id;
    fetchJson(apiUrl, function(data) {
      if (data && data.list && data.list.length > 0) {
        var fetched = data.list[0];
        if (fetched.vod_play_url && fetched.vod_play_url.trim() && _titleMatch(item.vod_name, fetched.vod_name)) {
          State.currentSourceUrl = url;
          openPlayerFrame(fetched, epIdx, resumeTime);
          return;
        }
      }
      onFail();
    }, function() {
      onFail();
    }, 8000);
  }

  var firstUrl = sourceUrl || getHomeSourceUrl();
  trySource(firstUrl, function() {
    var sources = State.settings.sources.filter(function(s) { return s.url !== firstUrl; });
    var idx = 0;
    function nextSource() {
      if (idx >= sources.length) {
        State.currentSourceUrl = firstUrl;
        openPlayerFrame(item, epIdx, resumeTime);
        return;
      }
      trySource(sources[idx++].url, nextSource);
    }
    nextSource();
  });
}

  setDetailIframeLoading('加载详情...');

function showDetail(item) {
  if (typeof item === 'string') item = JSON.parse(item);
  State.currentDetail = item;
  saveHomeView();
  document.getElementById('detailOverlay').classList.add('show');
  document.getElementById('detailOverlay').style.pointerEvents = 'auto';
  if (viewStack[viewStack.length - 1] !== 'detail') pushView('detail');
  setDetailIframeLoading('加载详情...');
  var sources = State.settings.sources;
  var found = false, completed = 0, total = sources.length;
  var fallbackTimer = setTimeout(function() {
    if (!found) { found = true; openDetailFrame(item); }
  }, 12000);
  var preferredUrl = State.currentSourceUrl || getHomeSourceUrl();
  var orderedSources = sources.slice().sort(function(a, b) {
    if (a.url === preferredUrl) return -1;
    if (b.url === preferredUrl) return 1;
    return 0;
  });
  orderedSources.forEach(function(source) {
    var apiUrl = source.url + '?ac=detail&ids=' + item.vod_id;
    fetchJson(apiUrl, function(data) {
      if (found) return;
      if (data && data.list && data.list.length > 0) {
        var detail = data.list[0];
        if (detail.vod_play_url && detail.vod_play_url.trim() && _titleMatch(item.vod_name, detail.vod_name)) {
          found = true;
          clearTimeout(fallbackTimer);
          State.currentSourceUrl = source.url;
          openDetailFrame(detail);
          return;
        }
      }
      completed++;
      if (completed >= total && !found) { clearTimeout(fallbackTimer); openDetailFrame(item); }
    }, function(e) {
      if (found) return;
      completed++;
      if (completed >= total && !found) { clearTimeout(fallbackTimer); openDetailFrame(item); }
    }, 8000);
  });
}

function openDetailFrame(item) {
  State.currentDetail = item;
  State.currentPlayFrom = (item.vod_play_from || '').split('$$$');
  State.currentPlayUrl = (item.vod_play_url || '').split('$$$');

// ========== 播放器核心（修复版，整合弹幕） ==========
function openPlayerFrame(detail, epIdx, resumeTime) {
  State.currentDetail = detail;
  State.currentPlayFrom = (detail.vod_play_from || '').split('$$$');
  State.currentPlayUrl = (detail.vod_play_url || '').split('$$$');
  var savedEp = epIdx;
  var savedTime = resumeTime || 0;
  if (epIdx === undefined || epIdx === null || epIdx === 0) {
    var progress = getLatestProgress(detail.vod_id || detail.vod_name);
    if (progress && progress.epIdx !== undefined && progress.epIdx >= 0) {
      savedEp = progress.epIdx;
      savedTime = savedTime || progress.currentTime || 0;
    }
  }
  if (!document.getElementById('playerSection').classList.contains('show')) pushView('player');
  document.getElementById('playerSection').classList.add('show');
  var detailOverlay = document.getElementById('detailOverlay');
  detailOverlay.classList.remove('show');
  detailOverlay.style.pointerEvents = 'none';
  var html;
  try {
    html = generatePlayerHtml(detail, savedEp, savedTime);
    console.log('[PLAYER] openPlayerFrame: html length=' + (html ? html.length : 'null') + ', epIdx=' + savedEp);
  } catch(e) {
    console.error('[PLAYER] generatePlayerHtml error:', e.message, e.stack);
    html = '<html><body style="background:#000;color:#fff;font-size:16px;padding:20px"><h3>播放器生成失败</h3><p>错误: ' + e.message + '</p><button onclick="parent.closePlayer()" style="padding:10px 20px;background:#0071e3;color:#fff;border:none;border-radius:8px;margin-top:10px">返回</button></body></html>';
  }
  var iframe = document.getElementById('playerIframe');
  if (iframe._blobUrl) { URL.revokeObjectURL(iframe._blobUrl); iframe._blobUrl = null; }
  iframe.removeAttribute('src');
  iframe.srcdoc = html;
  console.log('[PLAYER] srcdoc set, length=' + (html ? html.length : 0));
}

function closePlayerFrame() {
  var iframe = document.getElementById('playerIframe');
  try {
    var win = iframe.contentWindow;
    if (win && win._stopPlayer) win._stopPlayer();
  } catch(e) {}
  if (iframe._blobUrl) { URL.revokeObjectURL(iframe._blobUrl); iframe._blobUrl = null; }
  iframe.src = '';
  iframe.srcdoc = '';
  document.getElementById('playerSection').classList.remove('show');
}

// ========== 父页面辅助函数 ==========
function isFavorited(name) { return State.settings.favorites.some(function(f){return f.vod_name===name;}); }
function addFavoriteByName(detail) {
  var favorites = State.settings.favorites;
  var exists = favorites.some(function(f){return f.vod_name===detail.vod_name;});
  if (!exists) {
    favorites.unshift({ vod_id: detail.vod_id, vod_name: detail.vod_name, vod_pic: detail.vod_pic, vod_remarks: detail.vod_remarks, sourceUrl: State.currentSourceUrl || getHomeSourceUrl() });
    State.settings.favorites = favorites;
    Config.save(State.settings);
    showToast('已收藏');
  }
}
function removeFavoriteByName(name) {
  var favorites = State.settings.favorites.filter(function(f){return f.vod_name!==name;});
  State.settings.favorites = favorites;
  Config.save(State.settings);
  showToast('已取消收藏');
}

// ========== 搜索 ==========
function searchVideos(keyword) {
  if (!keyword || !keyword.trim()) return;
  keyword = keyword.trim();
  document.getElementById('searchInput').value = keyword;
  if (!State.isSearchView) {
    saveHomeView();
    State.isSearchView = true;
    pushView('search');
  }
  var view = document.getElementById('mainContent');
  view.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">搜索 "' + keyword + '" 中...</p></div>';
  State.searchResults = {};
  var sources = State.settings.sources, completed = 0, total = sources.length;
  sources.forEach(function(source) {
    var apiUrl = source.url + '?ac=videolist&wd=' + encodeURIComponent(keyword);
    fetchJson(apiUrl, function(data) {
      if (data && data.list && data.list.length > 0) State.searchResults[source.name] = { list: data.list, url: source.url };
      completed++;
      if (completed >= total) renderSearchResults(keyword);
      else updateSearchProgress(keyword, completed, total);
    }, function(e) {
      completed++;
      if (completed >= total) renderSearchResults(keyword);
      else updateSearchProgress(keyword, completed, total);
    }, 10000);
  });
}
function updateSearchProgress(keyword, done, total) {
  var view = document.getElementById('mainContent');
  if (view.querySelector('.loading')) view.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">搜索 "' + keyword + '" 中... (' + done + '/' + total + ')</p></div>';
}
function renderSearchResults(keyword) {
  var view = document.getElementById('mainContent');
  var sourceNames = Object.keys(State.searchResults);
  if (sourceNames.length === 0) {
    view.innerHTML = '<div class="search-back"><button class="search-back-btn" onclick="goBack()">← 返回</button></div><div class="empty"><div class="icon">😢</div><p>未找到 "' + keyword + '" 相关内容</p><p style="font-size:12px;margin-top:8px">试试切换代理或更换关键词</p></div>';
    return;
  }
  var html = '<div class="search-back"><button class="search-back-btn" onclick="goBack()">← 返回</button></div>';
  html += '<div class="section-title">🔍 搜索结果：' + keyword + '</div>';
  html += '<div class="source-tabs" id="sourceTabs">';
  var firstSource = sourceNames[0];
  sourceNames.forEach(function(name, i) {
    var count = State.searchResults[name].list.length;
    html += '<div class="source-tab' + (i === 0 ? ' active' : '') + '" data-source="' + name + '">' + name + '<span class="count">' + count + '</span></div>';
  });
  html += '</div><div id="videoGrid" class="video-grid"></div>';
  view.innerHTML = html;
  renderVideoGrid(firstSource);
}
function switchSourceTab(name, el) {

// ========== 进度缓存 ==========
function saveProgress(detail, epIdx, epName, currentTime, duration, playTab, playFromArr) {
  if (!detail || currentTime < 1) return;
  var key = 'vp_progress_' + (detail.vod_id || detail.vod_name);
  var progress = {
    vod_id: detail.vod_id,
    vod_name: detail.vod_name,
    vod_pic: detail.vod_pic,
    sourceUrl: State.currentSourceUrl || getHomeSourceUrl(),
    epIdx: epIdx,
    epName: epName,
    currentTime: currentTime,
    duration: duration,
    playTab: playTab || 0,
    playFromNames: playFromArr ? playFromArr.filter(function(f,i){return playFromArr[i] && (detail.vod_play_url||'').split('$$$')[i];}).join(',') : '',
    savedAt: Date.now()
  };
  try {
    var all = JSON.parse(_lsGet('vp_all_progress') || '{}');
    all[key] = progress;
    if (Object.keys(all).length > 100) {
      var keys = Object.keys(all);
      keys.sort(function(a,b){return (all[b].savedAt||0)-(all[a].savedAt||0);});
      var trimmed = {};
      keys.slice(0, 100).forEach(function(k){trimmed[k]=all[k];});
      all = trimmed;
    }
    _lsSet('vp_all_progress', JSON.stringify(all));
  } catch(e) {}
}
function getProgress(vodId, epIdx) {
  try {
    var all = JSON.parse(_lsGet('vp_all_progress') || '{}');
    var key = 'vp_progress_' + vodId;
    var p = all[key];
    if (p && p.epIdx === epIdx && p.currentTime > 0) {
      var pct = p.duration > 0 ? Math.round((p.currentTime / p.duration) * 100) : 0;
      if (pct > 5 && pct < 95) return p;
    }
  } catch(e) {}
  return null;
}
function getLatestProgress(vodId) {
  try {
    var all = JSON.parse(_lsGet('vp_all_progress') || '{}');
    var key = 'vp_progress_' + vodId;
    return all[key] || null;
  } catch(e) {}
  return null;
}
function getProgressPct(vodId) {
  var p = getLatestProgress(vodId);
  if (p && p.duration > 0) return Math.round((p.currentTime / p.duration) * 100);
  return 0;
}
function getProgressEpName(vodId) {
  var p = getLatestProgress(vodId);
  return p ? (p.epName || '') : '';
}
function fmtTimeShort(s) {
  if (!s || !isFinite(s)) return '00:00';
  var m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

function getDmGlobalSettings() {
  var def = {enabled:true, opacity:0.8, fontSize:20, area:0, color:"#ffffff", delay:0, speed:120};
  try {
    var s = JSON.parse(localStorage.getItem('vp_danmaku_settings') || '{}');
    if (s.opacity !== undefined) def.opacity = s.opacity;
    if (s.fontSize !== undefined) def.fontSize = s.fontSize;
    if (s.area !== undefined) def.area = s.area;
    if (s.color !== undefined) def.color = s.color;
    if (s.delay !== undefined) def.delay = s.delay;
    if (s.speed !== undefined) def.speed = s.speed;
    if (s.enabled !== undefined) def.enabled = s.enabled;
  } catch(e) {}
  return def;
}
function saveDmGlobalSettings(cfg) {
  try { localStorage.setItem('vp_danmaku_settings', JSON.stringify(cfg)); } catch(e) {}
}
function initDmConfigUI() {
  var cfg = getDmGlobalSettings();
  var tg = document.getElementById('cfgDmEnabled');
  if (tg) tg.classList.toggle('on', cfg.enabled);
  var op = document.getElementById('cfgDmOpacity');
  if (op) op.value = Math.round(cfg.opacity * 100);
  var fs = document.getElementById('cfgDmFontSize');
  if (fs) fs.value = cfg.fontSize;
  var sp = document.getElementById('cfgDmSpeed');
  if (sp) sp.value = cfg.speed;
  var dl = document.getElementById('cfgDmDelay');
  if (dl) dl.value = cfg.delay;
  var dlv = document.getElementById('cfgDmDelayVal');
  if (dlv) dlv.textContent = (cfg.delay >= 0 ? '+' : '') + cfg.delay.toFixed(1) + 's';
  document.querySelectorAll('.dm-cfg-area-btn').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.dataset.area) === cfg.area);
  });
  var cai = document.getElementById('cfgDmCustomApi');
  if (cai) {
    try { cai.value = localStorage.getItem('vp_dm_custom_api') || ''; } catch(e) { cai.value = ''; }
  }
}
function cfgDmToggle(el) {
  el.classList.toggle('on');
  cfgDmSave();
}

  document.querySelectorAll('.dm-cfg-area-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

function cfgDmAdjustDelay(delta) {
  var cfg = getDmGlobalSettings();
  cfg.delay = Math.max(-10, Math.min(10, +(cfg.delay + delta).toFixed(1)));
  var dl = document.getElementById('cfgDmDelay');
  if (dl) dl.value = cfg.delay;
  var dlv = document.getElementById('cfgDmDelayVal');
  if (dlv) dlv.textContent = (cfg.delay >= 0 ? '+' : '') + cfg.delay.toFixed(1) + 's';

function cfgDmOnDelayInput() {

  var val = parseFloat(dl.value);

  if (dlv) dlv.textContent = (val >= 0 ? '+' : '') + val.toFixed(1) + 's';

}
function cfgDmSave() {
  var cfg = getDmGlobalSettings();
  var tg = document.getElementById('cfgDmEnabled');
  if (tg) cfg.enabled = tg.classList.contains('on');
  var op = document.getElementById('cfgDmOpacity');
  if (op) cfg.opacity = parseInt(op.value) / 100;
  var fs = document.getElementById('cfgDmFontSize');
  if (fs) cfg.fontSize = parseInt(fs.value);
  var sp = document.getElementById('cfgDmSpeed');
  if (sp) cfg.speed = parseInt(sp.value);
  var dl = document.getElementById('cfgDmDelay');
  if (dl) cfg.delay = parseFloat(dl.value);
  var activeArea = document.querySelector('.dm-cfg-area-btn.active');
  if (activeArea) cfg.area = parseInt(activeArea.dataset.area);
  saveDmGlobalSettings(cfg);
}
function cfgDmSaveCustomApi() {
  var input = document.getElementById('cfgDmCustomApi');
  if (!input) return;
  var val = input.value.trim();
  if (val) {
    val = val.replace(/\/+$/, '');
    if (val.indexOf('http') !== 0) val = 'https://' + val;
  }
  try {
    if (val) { localStorage.setItem('vp_dm_custom_api', val); }
    else { localStorage.removeItem('vp_dm_custom_api'); }
  } catch(e) {}
  showToast(val ? '已保存自定义弹幕API' : '已清除自定义弹幕API');
}

document.getElementById('searchInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') searchVideos(this.value); });

function handleGlobalClick(e) {
  if (_touchHandled) { _touchHandled = false; return; }
  var resumeBtn = e.target.closest ? e.target.closest('[data-action^="resume-"]') : null;
  if (resumeBtn) {
    e.stopPropagation();
    e.preventDefault();
    var act = resumeBtn.getAttribute('data-action');
    var idx = parseInt(resumeBtn.getAttribute('data-idx'));
    if (act === 'resume-history') {
      var h = State.settings.history[idx];
      if (h) {
        var prog = getLatestProgress(h.vod_id || h.vod_name);
        var ep = prog ? prog.epIdx : 0;
        var t = prog ? prog.currentTime : 0;
        showDetailAndPlay({ vod_id: h.vod_id, vod_name: h.vod_name, vod_pic: h.vod_pic, vod_remarks: h.vod_remarks }, ep, t, h.sourceUrl || (prog && prog.sourceUrl));
      }
    } else if (act === 'resume-fav') {
      var f = State.settings.favorites[idx];
      if (f) {
        var prog2 = getLatestProgress(f.vod_id || f.vod_name);
        var ep2 = prog2 ? prog2.epIdx : 0;
        var t2 = prog2 ? prog2.currentTime : 0;
        showDetailAndPlay(f, ep2, t2, f.sourceUrl || (prog2 && prog2.sourceUrl));
      }
    }
    return;
  }
  var delBtn = e.target.closest ? e.target.closest('[data-action^="del-"]') : null;
  if (delBtn) {
    e.stopPropagation();
    e.preventDefault();
    var action = delBtn.getAttribute('data-action');
    var idx = parseInt(delBtn.getAttribute('data-idx'));
    if (action === 'del-history') removeHistory(idx);
    else if (action === 'del-fav') removeFavorite(idx);
    return;
  }
  var card = e.target.closest ? e.target.closest('[data-action]') : null;
  if (card) {
    var act = card.getAttribute('data-action');
    var cIdx = parseInt(card.getAttribute('data-idx'));
    if (act === 'show-history') {
      var h = State.settings.history[cIdx];
      if (h) {
        var prog = getLatestProgress(h.vod_id || h.vod_name);
        var ep = prog ? prog.epIdx : 0;
        var t = prog ? prog.currentTime : 0;
        showDetailAndPlay({ vod_id: h.vod_id, vod_name: h.vod_name, vod_pic: h.vod_pic, vod_remarks: h.vod_remarks }, ep, t, h.sourceUrl || (prog && prog.sourceUrl));
      }
    } else if (act === 'show-fav') {
      var f = State.settings.favorites[cIdx];
      if (f) {
        var prog2 = getLatestProgress(f.vod_id || f.vod_name);
        var ep2 = prog2 ? prog2.epIdx : 0;
        var t2 = prog2 ? prog2.currentTime : 0;
        showDetailAndPlay(f, ep2, t2, f.sourceUrl || (prog2 && prog2.sourceUrl));
      }
    } else if (act === 'search') {
      var src = card.getAttribute('data-source');
      var item = State.searchResults[src] && State.searchResults[src].list[cIdx];
      if (item) {
        State.currentSourceUrl = State.searchResults[src].url;
        showDetail(item);
      }
    } else if (act === 'home') {
      var videos = State.homeCache[State.homeCurrentType] || [];
      var hItem = videos[cIdx];
      if (hItem) showDetailFromHome(hItem);
    }
    return;
  }
  var catTab = e.target.closest ? e.target.closest('.cat-tab') : null;
  if (catTab && catTab.getAttribute('data-type-id') !== null) {
    switchHomeType(parseInt(catTab.getAttribute('data-type-id')), catTab);
    return;
  }
  var srcTab = e.target.closest ? e.target.closest('.source-tab') : null;
  if (srcTab && srcTab.getAttribute('data-source')) {
    switchSourceTab(srcTab.getAttribute('data-source'), srcTab);
    return;
  }
}
document.addEventListener('click', handleGlobalClick);

var _touchHandled = false;
document.addEventListener('touchend', function(e) {
  var matchBtn = e.target.closest ? e.target.closest('[data-action^="del-"],[data-action^="resume-"]') : null;
  if (matchBtn) {
    _touchHandled = true;
    e.preventDefault();
    e.stopPropagation();
    var action = matchBtn.getAttribute('data-action');
    var idx = parseInt(matchBtn.getAttribute('data-idx'));
    if (action === 'del-history') removeHistory(idx);
    else if (action === 'del-fav') removeFavorite(idx);
    else if (action === 'resume-history') {
      var h = State.settings.history[idx];
      if (h) {
        var prog = getLatestProgress(h.vod_id || h.vod_name);
        showDetailAndPlay({ vod_id: h.vod_id, vod_name: h.vod_name, vod_pic: h.vod_pic, vod_remarks: h.vod_remarks }, prog ? prog.epIdx : 0, prog ? prog.currentTime : 0, h.sourceUrl || (prog && prog.sourceUrl));
      }
    } else if (action === 'resume-fav') {
      var f = State.settings.favorites[idx];
      if (f) {
        var prog2 = getLatestProgress(f.vod_id || f.vod_name);
        showDetailAndPlay(f, prog2 ? prog2.epIdx : 0, prog2 ? prog2.currentTime : 0, f.sourceUrl || (prog2 && prog2.sourceUrl));
      }
    }
  }
}, {passive: false});

(function() {
  var status = document.getElementById('proxyStatus');
  function _hideStatus() { if (status) status.style.display = 'none'; }
  _fetchCompat(CORS_PROXIES[0]('https://cj.ffzyapi.com/api.php/provide/vod?ac=list'), 8000,

    function() {
      _hideStatus();
    }
  );
})();

function _flushData() {
  try {
    if (State.settings) Config.save(State.settings);
  } catch(e) {}
}
window.addEventListener('beforeunload', _flushData);
window.addEventListener('pagehide', _flushData);
window.addEventListener('unload', _flushData);
document.addEventListener('visibilitychange', function() {
  if (document.hidden || document.webkitHidden) _flushData();
});
setInterval(_flushData, 30000);

var _proxySel = document.getElementById('proxySelect');
if (_proxySel) _proxySel.value = proxyMode;
